<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page with Navigation</title>
    <link href="style.css" type="text/css" rel="stylesheet" />
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="search.html">Search</a></li>
            <li><a href="view.html">View</a></li>
            <li><a href="saved.html">Saved</a></li>
            <li><a href="help.html">Help</a></li>
        </ul>
    </nav>
    <div class="clear"></div> 
    <!-- Main Page Content -->
    <div class="content">
        <h1>Search Location</h1>
    </div>
    <div class="form-container">
        <h2>Search Location</h2>
        <!-- The name attribute on the form helps identify it in scripts -->
        <form name="nameSubmissionForm" action="/submit-path" method="POST">
            
            <!-- First Name Input Field -->
            <div class="form-group">
                <label for="firstName">City:</label>
                <input type="text" id="firstName" name="fname" placeholder="" required>
            </div>

            <!-- Last Name Input Field -->
            <div class="form-group">
                <label for="lastName">State:</label>
                <input type="text" id="lastName" name="lname" placeholder="" required>
            </div>

            <!-- Last Name Input Field -->
            <div class="form-group">
                <label for="lastName">Country:</label>
                <input type="text" id="lastName" name="lname" placeholder="" required>
            </div>
            <p class="red">OR</p>
            <!-- Last Name Input Field -->
            <div class="form-group">
                <label for="lastName">Zipcode:</label>
                <input type="text" id="lastName" name="lname" placeholder="" required>
            </div>

            <!-- Submit Button -->
            <button type="submit">Search</button>
        </form>
    </div>

</body>
</html>
