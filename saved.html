<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page with Navigation</title>
    <link href="style.css" type="text/css" rel="stylesheet" />
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="search.html">Search</a></li>
            <li><a href="view.html">View</a></li>
            <li><a href="saved.html">Saved</a></li>
            <li><a href="help.html">Help</a></li>
        </ul>
    </nav>

    <!-- Main Page Content -->
    <div class="content">
        <h1>Saved Location</h1>
    </div>
    <div id="location-1" class="saved container">
        <h2>Las Vegas, Nevada</h2>
        <!-- <a href="view.html"><img src="one.png" height="100" width="500"></a> -->
        <button onclick="deleteLocation('location-1')" class="redbutton">Remove</button>
    </div>
    <div id="location-2" class="saved container2">
        <h2>Vancouver, Washington</h2>
        <button onclick="deleteLocation('location-2')" class="redbutton">Remove</button>
    </div>
    <div id="location-3" class="saved container3">
        <h2>Portland, Oregon</h2>
        <button onclick="deleteLocation('location-3')" class="redbutton">Remove</button>
    </div>
    <div id="location-4" class="saved container4">
        <h2>Honolulu, Hawaii</h2>
        <button onclick="deleteLocation('location-4')" class="redbutton">Remove</button>
    </div>
    <script>
        function deleteLocation(elementId){
            const userConfirmed = confirm("Are you sure you want to delete");
            if (userConfirmed){
                const element = document.getElementById(elementId); 
                if (element){
                    element.remove();
                    alert("Location successfully deleted.");
                }
            } else {
                console.log("Deletion canceled by user.");
            }
        }
    </script>
</body>
</html>
